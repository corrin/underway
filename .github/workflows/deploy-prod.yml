name: Deploy Prod (Oracle Cloud)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to deploy"
        required: true
        default: main

permissions:
  contents: read

# Finish each deployment before starting another, including manual deployments.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://underway.today/login
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve deployment commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy commit
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.OC_SSH_HOST }}
          username: ${{ secrets.OC_SSH_USER }}
          key: ${{ secrets.OC_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu
            # Run as the service user with either existing SSH user configuration.
            run_as_underway() {
              if [ "$(id -un)" = underway ]; then
                "$@"
              else
                sudo -n -u underway -H "$@"
              fi
            }
            run_as_underway bash -s -- "$DEPLOY_SHA" <<'DEPLOY'
            set -euo pipefail
            sha="$1"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            cd /opt/underway
            # Load the helper from the deployment commit without assuming it is deployed yet.
            git fetch --no-tags origin "$sha"
            git show "$sha:scripts/deploy-prod.sh" | bash -s -- "$sha"
            DEPLOY

      - name: Verify public API and login page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 \
            --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors \
            https://underway.today/api/health \
            | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl --fail --silent --show-error --location --max-time 15 \
            https://underway.today/login \
            | python3 -c 'import sys; page = sys.stdin.read(); assert "id=\"app\"" in page and "type=\"module\"" in page'
